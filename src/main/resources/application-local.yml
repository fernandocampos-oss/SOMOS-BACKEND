  plaza-sap-service:
    url: http://localhost:9999/stub
    key: stub-key
  personal-sap-util-service:
    url: http://localhost:9999/stub
    key: stub-key
  marcacion-cons-service:
    url: http://localhost:9999/stub
    key: stub-key
  boleta-sap-service:
    url: http://localhost:9999/stub
